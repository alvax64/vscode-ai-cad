<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForgeCAD Renderer</title>
    <style>
      html,
      body,
      #cad_viewer {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #121316;
      }
    </style>
  </head>
  <body>
    <div id="cad_viewer"></div>
    <script type="module">
      import { createServiceDrivenRenderer } from "../src/forgecad-renderer-client.js";

      const renderer = createServiceDrivenRenderer();
      renderer.start().catch((error) => {
        document.body.textContent = error.message;
      });
    </script>
  </body>
</html>
