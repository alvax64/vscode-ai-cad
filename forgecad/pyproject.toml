[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecad"
version = "0.1.0"
description = "Shared CAD service foundation for AI-assisted hardware design workflows."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "TBD" }
authors = [
  { name = "ForgeCAD contributors" }
]

[project.scripts]
forgecad-service = "forgecad_service.server:main"

[tool.setuptools.packages.find]
where = [
  "python/forgecad_core",
  "python/forgecad_service"
]
